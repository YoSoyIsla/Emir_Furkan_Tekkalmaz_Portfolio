<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="pageTitle">Artwork</title>
    <meta name="description" id="metaDescription" content="Artwork by Emir Furkan Tekkalmaz.">
    <meta property="og:title" id="ogTitle" content="Artwork">
    <meta property="og:description" id="ogDescription" content="Artwork by Emir Furkan Tekkalmaz.">
    <link rel="icon" type="image/png" href="./assets/Emir_Logo.png">
    <link rel="apple-touch-icon" href="./assets/Emir_Logo.png">
    <script>
        (function () {
            try {
                var theme = localStorage.getItem('theme');
                if (theme === 'dark') {
                    document.documentElement.setAttribute('data-theme', 'dark');
                }
            } catch (e) { }
        })();
    </script>
    <link rel="stylesheet" href="style.css">
</head>

<body class="single-work-body">

    <!-- Sticky Navigation Scaffolding -->
    <header class="pinned_top">
        <div class="container_width">
            <div grid-row="" grid-pad="1" grid-gutter="2">
                <div grid-col="6" grid-pad="1" class="logo-col">
                    <h1><a href="index.html" class="nav-link">Emir Furkan Tekkalmaz</a></h1>
                </div>
                <div grid-col="2" grid-pad="1" class="desktop-only about-nav-col">
                    <a href="about.html" class="nav-link">About</a>
                </div>
                <div grid-col="2" grid-pad="1" class="desktop-only contact-nav-col">
                    <a href="contact.html" class="nav-link">Contact</a>
                </div>
                <div grid-col="2" grid-pad="1" class="desktop-only theme-nav-col">
                    <button class="theme-toggle-btn nav-link" onclick="toggleTheme()" aria-label="Toggle Theme">
                        <svg class="theme-icon sun-icon" width="18" height="18" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="5"></circle>
                            <line x1="12" y1="1" x2="12" y2="3"></line>
                            <line x1="12" y1="21" x2="12" y2="23"></line>
                            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                            <line x1="1" y1="12" x2="3" y2="12"></line>
                            <line x1="21" y1="12" x2="23" y2="12"></line>
                            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
                        </svg>
                        <svg class="theme-icon moon-icon" width="18" height="18" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                        </svg>
                    </button>
                </div>
                <div grid-col="6" grid-pad="1" class="mobile-only hamburger-col">
                    <button class="hamburger-btn" id="hamburgerBtn" onclick="toggleMobileMenu()" aria-label="Menu">
                        <span></span>
                        <span></span>
                    </button>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Workspace -->
    <main class="container_width single-work-main">

        <!-- Navigation Arrows (Desktop fixed flanking) -->
        <button class="desktop-only work-nav-arrow prev-arrow" id="prevWorkBtn" aria-label="Previous artwork"
            title="Previous artwork (Left Arrow)">
            ←
        </button>

        <button class="desktop-only work-nav-arrow next-arrow" id="nextWorkBtn" aria-label="Next artwork"
            title="Next artwork (Right Arrow)">
            →
        </button>

        <div class="single-work-wrapper">
            <!-- Center Prominent Artwork Frame (Left-aligned text matched to card width) -->
            <div class="single-work-frame" id="singleWorkFrame">
                <div class="single-work-card" id="singleWorkCard">
                    <img id="singleWorkImg" src="" alt="" loading="eager">
                </div>

                <!-- Two-line metadata aligned directly to the left side of the painting -->
                <div class="single-work-meta-container" id="singleWorkMetaContainer">
                    <h1 class="single-work-title" id="singleWorkTitle"></h1>
                    <div class="single-work-subline" id="singleWorkSubline"></div>
                </div>
            </div>

            <!-- Mobile Navigation Bar fixed at bottom of screen -->
            <div class="mobile-only mobile-nav-bar" id="mobileNavBar">
                <button class="work-nav-arrow prev-arrow" id="mobilePrevBtn" aria-label="Previous artwork">
                    <span class="nav-arrow-symbol">←</span>
                    <span class="nav-arrow-label">Previous</span>
                </button>
                <button class="work-nav-arrow next-arrow" id="mobileNextBtn" aria-label="Next artwork">
                    <span class="nav-arrow-label">Next</span>
                    <span class="nav-arrow-symbol">→</span>
                </button>
            </div>
        </div>
    </main>

    <!-- Mobile Drawer Overlay -->
    <div class="drawer-backdrop" id="drawerBackdrop" onclick="toggleMobileMenu()"></div>
    <div class="mobile-drawer" id="mobileDrawer">
        <div class="container_width">
            <nav class="drawer-nav">
                <a href="about.html" class="drawer-link">About</a>
                <a href="contact.html" class="drawer-link">Contact</a>
                <button class="theme-toggle-btn drawer-link" onclick="toggleTheme()" aria-label="Toggle Theme">
                    <svg class="theme-icon sun-icon" width="18" height="18" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="5"></circle>
                        <line x1="12" y1="1" x2="12" y2="3"></line>
                        <line x1="12" y1="21" x2="12" y2="23"></line>
                        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                        <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                        <line x1="1" y1="12" x2="3" y2="12"></line>
                        <line x1="21" y1="12" x2="23" y2="12"></line>
                        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                        <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
                    </svg>
                    <svg class="theme-icon moon-icon" width="18" height="18" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                    </svg>
                </button>
            </nav>
        </div>
    </div>

    <script type="module">
        import { WORKS } from './works-data.js';

        // Theme management
        function initTheme() {
            const savedTheme = localStorage.getItem('theme') || 'light';
            if (savedTheme === 'dark') {
                document.documentElement.setAttribute('data-theme', 'dark');
            } else {
                document.documentElement.removeAttribute('data-theme');
            }
        }

        window.toggleTheme = function () {
            const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
            if (isDark) {
                document.documentElement.removeAttribute('data-theme');
                localStorage.setItem('theme', 'light');
            } else {
                document.documentElement.setAttribute('data-theme', 'dark');
                localStorage.setItem('theme', 'dark');
            }
            if (document.activeElement && document.activeElement.blur) {
                document.activeElement.blur();
            }
        };

        initTheme();

        window.toggleMobileMenu = function () {
            const drawer = document.getElementById('mobileDrawer');
            const backdrop = document.getElementById('drawerBackdrop');
            const btn = document.getElementById('hamburgerBtn');
            if (drawer && backdrop && btn) {
                const isOpen = drawer.classList.toggle('open');
                backdrop.classList.toggle('show', isOpen);
                btn.classList.toggle('open', isOpen);
                document.body.style.overflow = isOpen ? 'hidden' : '';
            }
        };

        // Artwork View Logic
        let currentIndex = 0;

        function getInitialIndex() {
            const params = new URLSearchParams(window.location.search);
            const idParam = params.get('id');
            if (idParam) {
                const foundIndex = WORKS.findIndex(w => w.id.toLowerCase() === idParam.toLowerCase());
                if (foundIndex !== -1) return foundIndex;
                const parsedNum = parseInt(idParam, 10);
                if (!isNaN(parsedNum) && parsedNum >= 0 && parsedNum < WORKS.length) {
                    return parsedNum;
                }
            }
            return 0;
        }

        const frame = document.getElementById('singleWorkFrame');
        const img = document.getElementById('singleWorkImg');
        const card = document.getElementById('singleWorkCard');
        const titleEl = document.getElementById('singleWorkTitle');
        const sublineEl = document.getElementById('singleWorkSubline');
        const metaContainer = document.getElementById('singleWorkMetaContainer');
        const pageTitle = document.getElementById('pageTitle');

        function syncMetaWidth() {
            if (!metaContainer) return;
            if (window.innerWidth <= 768) {
                metaContainer.style.maxWidth = '100%';
                return;
            }
            if (card) {
                const rect = card.getBoundingClientRect();
                if (rect.width > 0) {
                    metaContainer.style.maxWidth = `${rect.width}px`;
                }
            }
        }

        window.addEventListener('resize', syncMetaWidth);

        let isSwitching = false;

        function renderWork(index, updateHistory = true) {
            if (index < 0) index = WORKS.length - 1;
            if (index >= WORKS.length) index = 0;
            currentIndex = index;

            const work = WORKS[currentIndex];

            if (updateHistory) {
                const newUrl = `${window.location.pathname}?id=${work.id}`;
                window.history.pushState({ index: currentIndex }, '', newUrl);
            }

            document.title = work.title;
            if (pageTitle) pageTitle.textContent = work.title;
            const ogTitle = document.getElementById('ogTitle');
            if (ogTitle) ogTitle.setAttribute('content', work.title);

            // Preload new artwork image
            const newImg = new Image();
            newImg.src = work.image;

            const applyContent = () => {
                img.src = work.image;
                img.alt = `${work.title}, ${work.year}`;
                img.classList.add('is-loaded');

                // Update typography/metadata
                titleEl.textContent = work.title;
                const sublineParts = [];
                if (work.dimensions) sublineParts.push(work.dimensions);
                if (work.medium) sublineParts.push(work.medium);
                if (work.year) sublineParts.push(work.year);
                sublineEl.textContent = sublineParts.join(', ');

                card.style.setProperty('--ar', work.aspectRatio || 1.2);
                syncMetaWidth();

                // Smoothly fade in new image & text together
                requestAnimationFrame(() => {
                    frame.classList.add('is-visible');
                    isSwitching = false;
                });
            };

            if (frame.classList.contains('is-visible')) {
                // Switching between artworks: smooth synchronized exit then entry
                isSwitching = true;
                frame.classList.remove('is-visible');
                card.classList.remove('is-progressive');

                const onExitDone = () => {
                    if (newImg.complete) {
                        applyContent();
                    } else {
                        newImg.onload = applyContent;
                    }
                };

                setTimeout(onExitDone, 280);
            } else {
                // Initial entrance
                if (newImg.complete) {
                    applyContent();
                } else {
                    newImg.onload = applyContent;
                }
            }
        }

        // Setup Zoom Tracking for the Single Work Card
        let progressiveTimer = null;
        let animationFrameId = null;

        function updateOrigin(e) {
            const rect = card.getBoundingClientRect();
            const x = Math.max(0, Math.min(100, ((e.clientX - rect.left) / rect.width) * 100));
            const y = Math.max(0, Math.min(100, ((e.clientY - rect.top) / rect.height) * 100));

            if (animationFrameId) cancelAnimationFrame(animationFrameId);
            animationFrameId = requestAnimationFrame(() => {
                img.style.transformOrigin = `${x}% ${y}%`;
            });
        }

        card.addEventListener('mouseenter', (e) => {
            updateOrigin(e);
            progressiveTimer = setTimeout(() => {
                card.classList.add('is-progressive');
            }, 120);
        });

        card.addEventListener('mousemove', (e) => {
            updateOrigin(e);
        });

        card.addEventListener('mouseleave', () => {
            if (progressiveTimer) {
                clearTimeout(progressiveTimer);
                progressiveTimer = null;
            }
            card.classList.remove('is-progressive');
            if (animationFrameId) cancelAnimationFrame(animationFrameId);
        });

        function setActiveNav(direction) {
            // Only apply persistent active highlight on desktop devices with pointer hover
            if (window.matchMedia('(hover: hover) and (min-width: 769px)').matches) {
                const prevBtn = document.getElementById('prevWorkBtn');
                const nextBtn = document.getElementById('nextWorkBtn');
                
                if (direction === 'prev') {
                    if (prevBtn) prevBtn.classList.add('is-active');
                    if (nextBtn) nextBtn.classList.remove('is-active');
                } else if (direction === 'next') {
                    if (nextBtn) nextBtn.classList.add('is-active');
                    if (prevBtn) prevBtn.classList.remove('is-active');
                }
            }
        }

        // Navigation triggers
        function goToNext() {
            setActiveNav('next');
            renderWork(currentIndex + 1);
        }

        function goToPrev() {
            setActiveNav('prev');
            renderWork(currentIndex - 1);
        }

        const prevWorkBtn = document.getElementById('prevWorkBtn');
        const nextWorkBtn = document.getElementById('nextWorkBtn');
        const mobilePrevBtn = document.getElementById('mobilePrevBtn');
        const mobileNextBtn = document.getElementById('mobileNextBtn');

        if (prevWorkBtn) prevWorkBtn.addEventListener('click', goToPrev);
        if (nextWorkBtn) nextWorkBtn.addEventListener('click', goToNext);

        if (mobilePrevBtn) {
            mobilePrevBtn.addEventListener('click', (e) => {
                goToPrev();
                if (document.activeElement && document.activeElement.blur) {
                    document.activeElement.blur();
                }
            });
        }

        if (mobileNextBtn) {
            mobileNextBtn.addEventListener('click', (e) => {
                goToNext();
                if (document.activeElement && document.activeElement.blur) {
                    document.activeElement.blur();
                }
            });
        }

        // Keyboard navigation
        window.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight') {
                goToNext();
            } else if (e.key === 'ArrowLeft') {
                goToPrev();
            } else if (e.key === 'Escape') {
                window.location.href = 'index.html';
            }
        });

        // Browser back/forward navigation
        window.addEventListener('popstate', (e) => {
            if (e.state && typeof e.state.index === 'number') {
                renderWork(e.state.index, false);
            } else {
                renderWork(getInitialIndex(), false);
            }
        });

        // Touch swipe gestures
        let touchStartX = 0;
        let touchEndX = 0;

        card.addEventListener('touchstart', (e) => {
            touchStartX = e.changedTouches[0].screenX;
        }, { passive: true });

        card.addEventListener('touchend', (e) => {
            touchEndX = e.changedTouches[0].screenX;
            const diff = touchEndX - touchStartX;
            if (Math.abs(diff) > 50) {
                if (diff < 0) {
                    goToNext();
                } else {
                    goToPrev();
                }
            }
        }, { passive: true });

        // Initialize view
        currentIndex = getInitialIndex();
        renderWork(currentIndex, false);
    </script>

</body>

</html>
