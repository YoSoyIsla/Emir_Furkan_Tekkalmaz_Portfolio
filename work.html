                if (dark) {

    <script type="module">
        import {
            WORKS,
            ARTIST,
            SITE_URL,
            imageSet,
            altText,
            sublineText,
            fullTitle,
            metaDescription,
            workUrl,
            artworkJsonLd,
        } from '/works-data.js';

        window.toggleMobileMenu = function () {
            const drawer = document.getElementById('mobileDrawer');
            const backdrop = document.getElementById('drawerBackdrop');
            const btn = document.getElementById('hamburgerBtn');
            if (drawer && backdrop && btn) {
                const isOpen = drawer.classList.toggle('open');
                backdrop.classList.toggle('show', isOpen);
                btn.classList.toggle('open', isOpen);
                document.body.style.overflow = isOpen ? 'hidden' : '';
            }
        };

        // ------------------------------------------------------------------
        // Artwork View Logic
        // ------------------------------------------------------------------
        let currentIndex = 0;

        function idFromLocation() {
            const m = /^\/work\/([^/]+?)(?:\.html)?\/?$/.exec(window.location.pathname);
            if (m) return decodeURIComponent(m[1]);
            return new URLSearchParams(window.location.search).get('id');
        }

        function getInitialIndex() {
            const idParam = idFromLocation();
            if (idParam) {
                const foundIndex = WORKS.findIndex(w => w.id.toLowerCase() === idParam.toLowerCase());
                if (foundIndex !== -1) return foundIndex;
                const parsedNum = parseInt(idParam, 10);
                if (!isNaN(parsedNum) && parsedNum >= 0 && parsedNum < WORKS.length) {
                    return parsedNum;
                }
            }
            return 0;
        }

        const stage = document.querySelector('.single-work-main');
        const wrapper = document.querySelector('.single-work-wrapper');
        const frame = document.getElementById('singleWorkFrame');
        const img = document.getElementById('singleWorkImg');
        const card = document.getElementById('singleWorkCard');
        const titleEl = document.getElementById('singleWorkTitle');
        const sublineEl = document.getElementById('singleWorkSubline');
        const metaContainer = document.getElementById('singleWorkMetaContainer');

        function computeMobileCardSize(ar) {
            const vh = window.innerHeight || document.documentElement.clientHeight;
            const vw = window.innerWidth || document.documentElement.clientWidth;
            const isLandscape = ar >= 1.0;

            const navTopH = 44;
            const navBottomH = 44;
            const horizontalBuffer = 40; // 20px left + 20px right margin
            const availW = Math.max(100, vw - horizontalBuffer);

            // Protected footprint for metadata text and grid row gap
            const metaH = metaContainer && metaContainer.offsetHeight > 0 ? metaContainer.offsetHeight : 52;
            const metaGap = 10;

            let w, h;

            if (isLandscape) {
                // Landscape / Wide: Available vertical space between navbars with subtle optical balance
                const opticalPadding = Math.round(vh * 0.04) + 24;
                const maxLandscapeH = Math.max(100, vh - navTopH - navBottomH - opticalPadding - metaH - metaGap);

                if (availW / ar <= maxLandscapeH) {
                    w = Math.floor(availW);
                    h = Math.floor(availW / ar);
                } else {
                    h = Math.floor(maxLandscapeH);
                    w = Math.floor(maxLandscapeH * ar);
                }
            } else {
                // Portrait / Tall: Protected top offset and ample clearance above bottom controls
                const topPadding = Math.min(60, Math.max(32, Math.round(vh * 0.055)));
                const bottomPadding = 32;
                const availH = vh - navTopH - navBottomH - topPadding - bottomPadding;
                const maxPortraitH = Math.max(100, availH - metaH - metaGap);

                if (maxPortraitH * ar <= availW) {
                    h = Math.floor(maxPortraitH);
                    w = Math.floor(maxPortraitH * ar);
                } else {
                    w = Math.floor(availW);
                    h = Math.floor(availW / ar);
                }
            }
            return { w, h, isLandscape };
        }

        function isMobileViewport() {
            return window.innerWidth <= 768;
        }

        /** Expected on-screen width (CSS px) of the artwork card, used for responsive image selection. */
        function expectedCardWidth(work) {
            const ar = work.aspectRatio || 1.2;
            if (isMobileViewport()) return computeMobileCardSize(ar).w;
            const maxH = parseFloat(getComputedStyle(card).maxHeight) || window.innerHeight * 0.75;
            const availW = (wrapper && wrapper.clientWidth) || window.innerWidth;
            return Math.min(availW, maxH * ar);
        }

        function updateMobileLayout() {
            if (!isMobileViewport()) {
                card.style.width = '';
                card.style.height = '';
                if (wrapper) {
                    wrapper.classList.remove('is-landscape', 'is-portrait');
                }
                if (metaContainer && card) {
                    const rect = card.getBoundingClientRect();
                    if (rect.width > 0) {
                        metaContainer.style.maxWidth = `${rect.width}px`;
                        metaContainer.style.width = `${rect.width}px`;
                    }
                }
                return;
            }

            const work = WORKS[currentIndex];
            const ar = (work && work.aspectRatio) ? work.aspectRatio : 1.2;
            const { w, h, isLandscape } = computeMobileCardSize(ar);

            if (wrapper) {
                wrapper.classList.toggle('is-landscape', isLandscape);
                wrapper.classList.toggle('is-portrait', !isLandscape);
            }

            card.style.width = `${w}px`;
            card.style.height = `${h}px`;
            if (metaContainer) {
                metaContainer.style.width = `${w}px`;
                metaContainer.style.maxWidth = `${w}px`;
            }
        }

        let resizeTicking = false;
        function syncMetaWidth() {
            if (!resizeTicking) {
                resizeTicking = true;
                requestAnimationFrame(() => {
                    updateMobileLayout();
                    resizeTicking = false;
                    // Keep a zoomed image inside the (possibly resized) frame.
                    if (zoomActive) setView(view.s, view.x, view.y, { clampToBounds: true });
                });
            }
        }

        window.addEventListener('resize', syncMetaWidth, { passive: true });
        window.addEventListener('orientationchange', () => {
            setTimeout(syncMetaWidth, 50);
        });

        // --- Responsive image handling -------------------------------------
        // The <img> uses a width-described srcset; `sizes` is set to the real card width so the
        // browser picks the smallest sufficient file, and is raised while zooming so a sharper
        // version (up to the full-resolution master) is fetched only when it is actually needed.
        let sizesPx = 0;

        function setImageSizes(px) {
            const rounded = Math.ceil(px / 50) * 50;
            if (rounded > sizesPx) {
                sizesPx = rounded;
                img.sizes = `${rounded}px`;
            }
        }

        function candidateWidth(url, set) {
            const m = /-(\d+)\.webp(?:$|\?)/.exec(url || '');
            return m ? parseInt(m[1], 10) : (url ? set.width : 0);
        }

        function maybeUpgradeResolution(scale) {
            if (scale <= 1.15) return;
            const width = card.getBoundingClientRect().width || card.offsetWidth;
            if (width > 0) setImageSizes(width * Math.min(scale, 3));
        }

        function preloadWork(work) {
            if (!work) return;
            const set = imageSet(work);
            const pre = new Image();
            pre.decoding = 'async';
            pre.sizes = `${Math.ceil(expectedCardWidth(work) / 50) * 50}px`;
            pre.srcset = set.srcset;
            pre.src = set.src;
        }

        // --- Document head (title, description, canonical, social, JSON-LD) -
        function setMeta(id, value, attr = 'content') {
            const el = document.getElementById(id);
            if (el) el.setAttribute(attr, value);
        }

        function updateHead(work) {
            const set = imageSet(work);
            const title = `${work.title} (${work.year}) | ${ARTIST.name}`;
            const description = metaDescription(work);
            const url = workUrl(work);
            const ogImage = `${SITE_URL}${set.og}`;
            document.title = title;
            setMeta('metaDescription', description);
            setMeta('canonicalLink', url, 'href');
            setMeta('ogTitle', title);
            setMeta('ogDescription', description);
            setMeta('ogUrl', url);
            setMeta('ogImage', ogImage);
            setMeta('ogImageWidth', String(Math.min(1200, set.width)));
            setMeta('ogImageHeight', String(Math.round((Math.min(1200, set.width) * set.height) / set.width)));
            setMeta('ogImageAlt', altText(work));
            setMeta('twTitle', title);
            setMeta('twDescription', description);
            setMeta('twImage', ogImage);
            const ld = document.getElementById('workJsonLd');
            if (ld) {
                ld.textContent = JSON.stringify({
                    '@context': 'https://schema.org',
                    '@graph': [
                        {
                            '@type': 'WebPage',
                            '@id': `${url}#webpage`,
                            url,
                            name: title,
                            description,
                            isPartOf: { '@id': `${SITE_URL}/#website` },
                            primaryImageOfPage: `${SITE_URL}${set.full}`,
                            mainEntity: { '@id': `${url}#artwork` },
                        },
                        artworkJsonLd(work),
                    ],
                });
            }
        }

        let isSwitching = false;
        let renderToken = 0;

        function renderWork(index, updateHistory = true) {
            resetZoom(false);
            if (index < 0) index = WORKS.length - 1;
            if (index >= WORKS.length) index = 0;
            currentIndex = index;

            const work = WORKS[currentIndex];
            const set = imageSet(work);
            const token = ++renderToken;

            if (updateHistory) {
                window.history.pushState({ index: currentIndex }, '', `/work/${work.id}`);
            } else if (/[?&]id=/.test(window.location.search)) {
                // Legacy /work?id=<id> links: normalise the address bar to the canonical URL.
                window.history.replaceState({ index: currentIndex }, '', `/work/${work.id}`);
            }

            updateHead(work);

            // Pre-rendered page: the <img> already holds this artwork, keep its request.
            const alreadyRendered = img.getAttribute('srcset') === set.srcset;
            const sizes = `${Math.ceil(expectedCardWidth(work) / 50) * 50}px`;

            // Preload new artwork image (same srcset/sizes as the visible <img> => one request).
            // A pre-rendered page is already loading it in the visible <img>, so wait on that.
            let loader = img;
            if (!alreadyRendered) {
                loader = new Image();
                loader.decoding = 'async';
                loader.sizes = sizes;
                loader.srcset = set.srcset;
                loader.src = set.src;
            }

            const applyContent = () => {
                if (token !== renderToken) return;
                if (!alreadyRendered) {
                    sizesPx = 0;
                    img.sizes = sizes;
                    img.srcset = set.srcset;
                    img.src = set.src;
                    img.width = set.width;
                    img.height = set.height;
                } else {
                    // Pre-rendered page: start the zoom upgrade threshold at what is already displayed.
                    const shown = candidateWidth(img.currentSrc || img.src, set);
                    sizesPx = Math.max(parseInt(sizes, 10) || 0, Math.floor(shown / (window.devicePixelRatio || 1)));
                }
                img.alt = altText(work);
                img.classList.add('is-loaded');

                // Update typography/metadata
                titleEl.textContent = work.title;
                sublineEl.textContent = sublineText(work);

                card.style.setProperty('--ar', work.aspectRatio || 1.2);
                syncMetaWidth();

                // Smoothly fade in new image & text together
                requestAnimationFrame(() => {
                    frame.classList.add('is-visible');
                    isSwitching = false;
                });

                // Warm the cache for the neighbours so prev/next feel instant.
                const n = WORKS.length;
                setTimeout(() => {
                    preloadWork(WORKS[(currentIndex + 1) % n]);
                    preloadWork(WORKS[(currentIndex - 1 + n) % n]);
                }, 400);
            };

            const whenReady = (fn) => {
                if (loader.complete && loader.naturalWidth > 0) {
                    fn();
                } else {
                    loader.addEventListener('load', fn, { once: true });
                    loader.addEventListener('error', fn, { once: true });
                }
            };

            if (frame.classList.contains('is-visible')) {
                // Switching between artworks: smooth synchronized exit then entry
                isSwitching = true;
                frame.classList.remove('is-visible');
                cancelHover();
                setTimeout(() => whenReady(applyContent), 280);
            } else {
                // Initial entrance
                whenReady(applyContent);
            }
        }

        // ------------------------------------------------------------------
        // Desktop hover zoom (mouse only; never triggered by touch taps)
        // ------------------------------------------------------------------
        const finePointer = window.matchMedia('(hover: hover) and (pointer: fine)');
        let progressiveTimer = null;
        let originFrame = 0;

        function cancelHover() {
            if (progressiveTimer) {
                clearTimeout(progressiveTimer);
                progressiveTimer = null;
            }
            card.classList.remove('is-progressive');
            if (originFrame) cancelAnimationFrame(originFrame);
            originFrame = 0;
        }

        function updateOrigin(e) {
            const rect = card.getBoundingClientRect();
            const x = Math.max(0, Math.min(100, ((e.clientX - rect.left) / rect.width) * 100));
            const y = Math.max(0, Math.min(100, ((e.clientY - rect.top) / rect.height) * 100));

            if (originFrame) cancelAnimationFrame(originFrame);
            originFrame = requestAnimationFrame(() => {
                originFrame = 0;
                if (!zoomActive) img.style.transformOrigin = `${x}% ${y}%`;
            });
        }

        function armProgressive() {
            if (progressiveTimer || card.classList.contains('is-progressive')) return;
            progressiveTimer = setTimeout(() => {
                progressiveTimer = null;
                if (!zoomActive) card.classList.add('is-progressive');
            }, 120);
        }

        const isMouseHover = (e) => e.pointerType === 'mouse' && finePointer.matches && !zoomActive && !isSwitching;

        card.addEventListener('pointerenter', (e) => {
            if (!isMouseHover(e)) return;
            updateOrigin(e);
            armProgressive();
        });

        card.addEventListener('pointermove', (e) => {
            if (!isMouseHover(e) || pointers.size) return;
            updateOrigin(e);
            armProgressive();
        });

        card.addEventListener('pointerleave', (e) => {
            if (e.pointerType === 'mouse') cancelHover();
        });

        card.addEventListener('dragstart', (e) => e.preventDefault());

        // ------------------------------------------------------------------
        // Full-view zoom & pan engine
        //   Mouse wheel / trackpad pinch (ctrl+wheel) / Safari gesture events,
        //   touch pinch with focal point, one-finger & mouse drag panning with
        //   inertia, double-tap / double-click zoom, keyboard + / - / 0.
        // The image is transformed inside the card (overflow: hidden), so the page
        // viewport itself never zooms or scrolls.
        // ------------------------------------------------------------------
        const MAX_SCALE = 5;
        const TAP_ZOOM_SCALE = 2.5;
        const view = { s: 1, x: 0, y: 0 };
        let zoomActive = false;
        let goal = null;
        let animFrame = 0;
        let lastFrameTs = 0;
        let inertiaFrame = 0;

        const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));

        function cardGeometry() {
            const r = card.getBoundingClientRect();
            const w = r.width || card.offsetWidth;
            const h = r.height || card.offsetHeight;
            return { left: r.left, top: r.top, w, h, cx: r.left + w / 2, cy: r.top + h / 2 };
        }

        function panBounds(s) {
            const { w, h } = cardGeometry();
            return { mx: Math.max(0, (w * (s - 1)) / 2), my: Math.max(0, (h * (s - 1)) / 2) };
        }

        function rubberBand(v, max) {
            const a = Math.abs(v);
            return a <= max ? v : Math.sign(v) * (max + (a - max) * 0.35);
        }

        /** Point relative to the card centre, clamped to the card. */
        function focalPoint(clientX, clientY) {
            const g = cardGeometry();
            return {
                x: clamp(clientX, g.left, g.left + g.w) - g.cx,
                y: clamp(clientY, g.top, g.top + g.h) - g.cy,
            };
        }

        function isIdentity(s, x, y) {
            return Math.abs(s - 1) < 0.0005 && Math.abs(x) < 0.3 && Math.abs(y) < 0.3;
        }

        // Take over seamlessly from the CSS hover zoom (scale around the cursor) so the
        // image never jumps when a wheel / pinch / drag gesture starts.
        function captureHoverTransform() {
            if (zoomActive) return;
            const cs = getComputedStyle(img);
            let a = 1, e = 0, f = 0;
            if (cs.transform && cs.transform !== 'none') {
                const m = new DOMMatrixReadOnly(cs.transform);
                a = m.a; e = m.e; f = m.f;
            }
            const [ox, oy] = cs.transformOrigin.split(' ').map(parseFloat);
            const relX = (isNaN(ox) ? img.offsetWidth / 2 : ox) - img.offsetWidth / 2;
            const relY = (isNaN(oy) ? img.offsetHeight / 2 : oy) - img.offsetHeight / 2;
            view.s = a;
            view.x = (1 - a) * relX + e;
            view.y = (1 - a) * relY + f;
        }

        function beginZoomStyles() {
            if (zoomActive) return;
            zoomActive = true;
            cancelHover();
            card.classList.add('is-zoomed');
            img.style.setProperty('transition', 'none', 'important');
            img.style.setProperty('transform-origin', '50% 50%', 'important');
            img.style.setProperty('will-change', 'transform');
        }

        function endZoomStyles() {
            zoomActive = false;
            view.s = 1;
            view.x = 0;
            view.y = 0;
            card.classList.remove('is-zoomed', 'is-dragging');
            img.style.removeProperty('transform');
            img.style.removeProperty('-webkit-transform');
            img.style.removeProperty('transition');
            img.style.removeProperty('transform-origin');
            img.style.removeProperty('will-change');
        }

        function paint() {
            if (!zoomActive) beginZoomStyles();
            const t = `translate3d(${view.x.toFixed(2)}px, ${view.y.toFixed(2)}px, 0) scale(${view.s.toFixed(4)})`;
            img.style.setProperty('transform', t, 'important');
            maybeUpgradeResolution(view.s);
        }

        function stopAnimation() {
            if (animFrame) cancelAnimationFrame(animFrame);
            animFrame = 0;
            goal = null;
        }

        function stopInertia() {
            if (inertiaFrame) cancelAnimationFrame(inertiaFrame);
            inertiaFrame = 0;
        }

        /** Jump straight to a view (used while fingers / mouse are moving). */
        function setView(s, x, y, { clampToBounds = false } = {}) {
            stopAnimation();
            if (clampToBounds) {
                const { mx, my } = panBounds(s);
                x = clamp(x, -mx, mx);
                y = clamp(y, -my, my);
            }
            if (isIdentity(s, x, y)) {
                if (zoomActive) endZoomStyles();
                else { view.s = 1; view.x = 0; view.y = 0; }
                return;
            }
            view.s = s;
            view.x = x;
            view.y = y;
            paint();
        }

        /** Ease smoothly towards a view (wheel steps, double-tap, settling). */
        function animateTo(s, x, y) {
            stopInertia();
            if (!zoomActive && isIdentity(s, x, y)) {
                view.s = 1; view.x = 0; view.y = 0;
                return;
            }
            goal = { s, x, y };
            // (Re)start the loop; the time check guards against a stalled frame on throttled devices.
            if (!animFrame || performance.now() - lastFrameTs > 250) {
                if (animFrame) cancelAnimationFrame(animFrame);
                lastFrameTs = performance.now();
                animFrame = requestAnimationFrame(stepAnimation);
            }
        }

        function stepAnimation(ts) {
            if (!goal) {
                animFrame = 0;
                return;
            }
            const dt = Math.min(120, Math.max(1, ts - lastFrameTs));
            lastFrameTs = ts;
            const k = 1 - Math.exp(-dt / 70);
            view.s += (goal.s - view.s) * k;
            view.x += (goal.x - view.x) * k;
            view.y += (goal.y - view.y) * k;
            const done =
                Math.abs(goal.s - view.s) < 0.0015 &&
                Math.abs(goal.x - view.x) < 0.4 &&
                Math.abs(goal.y - view.y) < 0.4;
            if (done) {
                const g = goal;
                goal = null;
                animFrame = 0;
                if (isIdentity(g.s, g.x, g.y)) {
                    endZoomStyles();
                } else {
                    view.s = g.s;
                    view.x = g.x;
                    view.y = g.y;
                    paint();
                }
                return;
            }
            paint();
            animFrame = requestAnimationFrame(stepAnimation);
        }

        /** The view the user is heading to (animation goal) or currently seeing. */
        function baseView() {
            return goal ? { ...goal } : { s: view.s, x: view.x, y: view.y };
        }

        /** New view after scaling by `factor` around a focal point (relative to the card centre). */
        function zoomedView(base, newScale, focal) {
            const ratio = newScale / base.s;
            let x = focal.x - (focal.x - base.x) * ratio;
            let y = focal.y - (focal.y - base.y) * ratio;
            if (newScale <= 1) return { s: 1, x: 0, y: 0 };
            const { mx, my } = panBounds(newScale);
            return { s: newScale, x: clamp(x, -mx, mx), y: clamp(y, -my, my) };
        }

        function zoomBy(factor, clientX, clientY, { smooth = true } = {}) {
            captureHoverTransform();
            stopInertia();
            const base = baseView();
            const s = clamp(base.s * factor, 1, MAX_SCALE);
            const next = zoomedView(base, s, focalPoint(clientX, clientY));
            if (smooth) animateTo(next.s, next.x, next.y);
            else setView(next.s, next.x, next.y);
        }

        function toggleZoomAt(clientX, clientY) {
            if (zoomActive && view.s > 1.05) {
                animateTo(1, 0, 0);
            } else {
                captureHoverTransform();
                const next = zoomedView(baseView(), TAP_ZOOM_SCALE, focalPoint(clientX, clientY));
                animateTo(next.s, next.x, next.y);
            }
        }

        /** Snap back inside the limits after a gesture ends. */
        function settle() {
            let s = clamp(view.s, 1, MAX_SCALE);
            if (s < 1.03) s = 1;
            if (s === 1) {
                animateTo(1, 0, 0);
                return;
            }
            // Keep the point under the gesture centre fixed while correcting an over-zoom.
            const ratio = s / view.s;
            const { mx, my } = panBounds(s);
            animateTo(s, clamp(view.x * ratio, -mx, mx), clamp(view.y * ratio, -my, my));
        }

        function resetZoom(animated = true) {
            stopInertia();
            pointers.clear();
            gesture = null;
            if (animated && zoomActive) {
                animateTo(1, 0, 0);
            } else {
                stopAnimation();
                if (zoomActive) endZoomStyles();
            }
        }

        // --- Mouse wheel & trackpad pinch ---------------------------------
        stage.addEventListener('wheel', (e) => {
            if (e.target.closest('button, a')) return;
            e.preventDefault(); // never scroll or browser-zoom the page from the artwork stage
            if (isSwitching) return;

            const unit = e.deltaMode === 1 ? 16 : e.deltaMode === 2 ? window.innerHeight : 1;
            const dx = e.deltaX * unit;
            const dy = e.deltaY * unit;

            if (e.ctrlKey) {
                // Trackpad pinch (and ctrl + wheel): continuous, follow the fingers directly.
                zoomBy(Math.exp(-dy * 0.01), e.clientX, e.clientY, { smooth: false });
                return;
            }

            if (zoomActive && Math.abs(dx) > Math.abs(dy)) {
                // Horizontal two-finger scroll while zoomed: pan sideways.
                const base = baseView();
                setView(base.s, base.x - dx, base.y, { clampToBounds: true });
                return;
            }

            // Mouse wheel: smooth, eased zoom steps around the cursor.
            zoomBy(Math.exp(-clamp(dy, -120, 120) * 0.0022), e.clientX, e.clientY, { smooth: true });
        }, { passive: false });

        // --- Safari (macOS) trackpad pinch: WebKit gesture events --------
        // Also blocks iOS Safari's native page pinch-zoom on this page.
        let gestureBase = null;
        const onGestureStart = (e) => {
            e.preventDefault();
            if (pointers.size || !stage.contains(e.target)) return; // touch pinch is handled by pointer events
            captureHoverTransform();
            stopAnimation();
            stopInertia();
            gestureBase = { s: view.s, x: view.x, y: view.y };
        };
        const onGestureChange = (e) => {
            e.preventDefault();
            if (pointers.size || !gestureBase) return;
            const s = clamp(gestureBase.s * e.scale, 1, MAX_SCALE);
            const next = zoomedView(gestureBase, s, focalPoint(e.clientX, e.clientY));
            setView(next.s, next.x, next.y);
        };
        const onGestureEnd = (e) => {
            e.preventDefault();
            if (!gestureBase) return;
            gestureBase = null;
            if (!pointers.size) settle();
        };
        [['gesturestart', onGestureStart], ['gesturechange', onGestureChange], ['gestureend', onGestureEnd]].forEach(([type, fn]) => {
            document.addEventListener(type, fn, { passive: false, capture: true });
        });

        // --- Pointer gestures (touch pinch / pan / swipe / double-tap, mouse drag) --
        const pointers = new Map();
        let gesture = null;
        let lastTap = null;
        let lastPointerType = 'mouse';
        const velocitySamples = [];

        const ignoreTarget = (target) => !!target.closest('button, a, .mobile-nav-bar, .pinned_top, .mobile-drawer');

        function recordVelocity(x, y) {
            const now = performance.now();
            velocitySamples.push({ t: now, x, y });
            while (velocitySamples.length && now - velocitySamples[0].t > 90) velocitySamples.shift();
        }

        function releaseVelocity() {
            if (velocitySamples.length < 2) return { vx: 0, vy: 0 };
            const a = velocitySamples[0];
            const b = velocitySamples[velocitySamples.length - 1];
            const dt = b.t - a.t;
            if (dt < 8 || performance.now() - b.t > 60) return { vx: 0, vy: 0 };
            return { vx: (b.x - a.x) / dt, vy: (b.y - a.y) / dt };
        }

        function startInertia(vx, vy) {
            stopInertia();
            let last = performance.now();
            const step = (ts) => {
                const dt = Math.min(48, Math.max(1, ts - last));
                last = ts;
                const decay = Math.pow(0.95, dt / 16);
                vx *= decay;
                vy *= decay;
                const { mx, my } = panBounds(view.s);
                let x = view.x + vx * dt;
                let y = view.y + vy * dt;
                if (Math.abs(x) >= mx) { x = clamp(x, -mx, mx); vx = 0; }
                if (Math.abs(y) >= my) { y = clamp(y, -my, my); vy = 0; }
                view.x = x;
                view.y = y;
                paint();
                if (Math.hypot(vx, vy) < 0.02) {
                    inertiaFrame = 0;
                    return;
                }
                inertiaFrame = requestAnimationFrame(step);
            };
            inertiaFrame = requestAnimationFrame(step);
        }

        function startPan(p, pointerType) {
            gesture = {
                type: 'pan',
                pointerType,
                startX: p.x,
                startY: p.y,
                startPanX: view.x,
                startPanY: view.y,
                startTime: performance.now(),
                moved: false,
            };
            velocitySamples.length = 0;
            recordVelocity(view.x, view.y);
            if (pointerType === 'mouse') card.classList.add('is-dragging');
        }

        function startPinch() {
            const [p1, p2] = [...pointers.values()];
            captureHoverTransform();
            stopAnimation();
            stopInertia();
            const g = cardGeometry();
            const midX = (p1.x + p2.x) / 2 - g.cx;
            const midY = (p1.y + p2.y) / 2 - g.cy;
            gesture = {
                type: 'pinch',
                startDist: Math.max(1, Math.hypot(p2.x - p1.x, p2.y - p1.y)),
                startScale: view.s,
                // Artwork point (in unscaled card coordinates) under the fingers' midpoint
                focalImgX: (midX - view.x) / view.s,
                focalImgY: (midY - view.y) / view.s,
            };
            card.classList.remove('is-dragging');
        }

        stage.addEventListener('pointerdown', (e) => {
            if (ignoreTarget(e.target)) return;
            if (e.pointerType === 'mouse' && e.button !== 0) return;
            lastPointerType = e.pointerType;

            // A mouse only drags when zoomed in; plain clicks keep the hover zoom untouched.
            if (e.pointerType === 'mouse' && !(zoomActive && view.s > 1.01)) return;
            if (e.pointerType !== 'mouse') cancelHover();
            if (pointers.size >= 2) return; // ignore extra fingers

            pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
            try { stage.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }

            if (pointers.size === 2) {
                e.preventDefault();
                startPinch();
                return;
            }

            stopInertia();
            const p = { x: e.clientX, y: e.clientY };
            if (zoomActive && view.s > 1.01) {
                e.preventDefault();
                stopAnimation();
                startPan(p, e.pointerType);
            } else {
                // Not zoomed: a touch may become a swipe (navigate) or a (double) tap.
                gesture = { type: 'idle', pointerType: e.pointerType, startX: p.x, startY: p.y, startTime: performance.now(), moved: false };
            }
        });

        stage.addEventListener('pointermove', (e) => {
            const p = pointers.get(e.pointerId);
            if (!p || !gesture) return;
            p.x = e.clientX;
            p.y = e.clientY;

            if (gesture.type === 'pinch' && pointers.size >= 2) {
                const [p1, p2] = [...pointers.values()];
                const dist = Math.hypot(p2.x - p1.x, p2.y - p1.y);
                let s = gesture.startScale * (dist / gesture.startDist);
                // Soft limits: rubber-band below 1x and above the max zoom
                if (s < 1) s = Math.max(0.6, 1 - (1 - s) * 0.5);
                if (s > MAX_SCALE) s = MAX_SCALE + (s - MAX_SCALE) * 0.3;
                const g = cardGeometry();
                const midX = (p1.x + p2.x) / 2 - g.cx;
                const midY = (p1.y + p2.y) / 2 - g.cy;
                // Keep the artwork point under the fingers pinned to the fingers
                const { mx, my } = panBounds(Math.max(1, s));
                const x = rubberBand(midX - gesture.focalImgX * s, mx);
                const y = rubberBand(midY - gesture.focalImgY * s, my);
                view.s = s;
                view.x = x;
                view.y = y;
                stopAnimation();
                paint();
                return;
            }

            const dx = e.clientX - gesture.startX;
            const dy = e.clientY - gesture.startY;
            if (Math.hypot(dx, dy) > 8) gesture.moved = true;

            if (gesture.type === 'pan') {
                const { mx, my } = panBounds(view.s);
                view.x = rubberBand(gesture.startPanX + dx, mx);
                view.y = rubberBand(gesture.startPanY + dy, my);
                recordVelocity(view.x, view.y);
                paint();
            }
        });

        function finishPointer(e, cancelled) {
            if (!pointers.has(e.pointerId)) return;
            pointers.delete(e.pointerId);
            try { stage.releasePointerCapture(e.pointerId); } catch (err) { /* ignore */ }
            if (!gesture) return;

            if (gesture.type === 'pinch') {
                if (pointers.size === 1 && !cancelled) {
                    // One finger lifted: hand over to single-finger panning without a jump.
                    const [rest] = [...pointers.values()];
                    if (view.s > 1.02) {
                        const { mx, my } = panBounds(view.s);
                        view.x = clamp(view.x, -mx, mx);
                        view.y = clamp(view.y, -my, my);
                        paint();
                        startPan(rest, 'touch');
                        gesture.moved = true;
                    } else {
                        gesture = { type: 'idle', pointerType: 'touch', startX: rest.x, startY: rest.y, startTime: performance.now(), moved: true, noSwipe: true };
                        settle();
                    }
                } else if (pointers.size === 0) {
                    gesture = null;
                    settle();
                }
                return;
            }

            if (pointers.size > 0) return;
            const g = gesture;
            gesture = null;
            card.classList.remove('is-dragging');
            if (cancelled) {
                settle();
                return;
            }

            const dx = e.clientX - g.startX;
            const dy = e.clientY - g.startY;
            const duration = performance.now() - g.startTime;
            const isTap = !g.moved && duration < 300;

            if (g.type === 'pan') {
                const { mx, my } = panBounds(view.s);
                const overscrolled = Math.abs(view.x) > mx + 0.5 || Math.abs(view.y) > my + 0.5;
                const outOfRange = view.s > MAX_SCALE + 0.001 || view.s < 1;
                const { vx, vy } = releaseVelocity();
                if (overscrolled || outOfRange) {
                    settle();
                } else if (Math.hypot(vx, vy) > 0.25 && g.moved) {
                    startInertia(vx, vy);
                }
            } else if (g.type === 'idle' && g.pointerType !== 'mouse' && !g.noSwipe) {
                // Swipe navigation between artworks (only when not zoomed)
                if (Math.abs(dx) > 45 && Math.abs(dx) > Math.abs(dy) * 1.3 && duration < 500) {
                    if (dx < 0) goToNext();
                    else goToPrev();
                    lastTap = null;
                    return;
                }
            }

            // Double-tap (touch / pen): zoom in at the tap point, or back out when zoomed.
            if (isTap && g.pointerType !== 'mouse') {
                const now = performance.now();
                if (lastTap && now - lastTap.t < 320 && Math.hypot(e.clientX - lastTap.x, e.clientY - lastTap.y) < 30) {
                    lastTap = null;
                    toggleZoomAt(e.clientX, e.clientY);
                } else {
                    lastTap = { t: now, x: e.clientX, y: e.clientY };
                }
            }
        }

        stage.addEventListener('pointerup', (e) => finishPointer(e, false));
        stage.addEventListener('pointercancel', (e) => finishPointer(e, true));

        // Desktop double-click toggles zoom at the cursor.
        card.addEventListener('dblclick', (e) => {
            if (lastPointerType !== 'mouse') return; // touch double-taps are handled above
            e.preventDefault();
            toggleZoomAt(e.clientX, e.clientY);
        });

        // Navigation triggers
        function goToNext() {
            renderWork(currentIndex + 1);
        }

        function goToPrev() {
            renderWork(currentIndex - 1);
        }

        const navButtons = [
            ['prevWorkBtn', goToPrev],
            ['nextWorkBtn', goToNext],
            ['mobilePrevBtn', goToPrev],
            ['mobileNextBtn', goToNext],
        ];
        navButtons.forEach(([id, action]) => {
            const btn = document.getElementById(id);
            if (!btn) return;
            btn.addEventListener('click', () => {
                action();
                if (document.activeElement && document.activeElement.blur) {
                    document.activeElement.blur();
                }
            });
        });

        // Keyboard navigation & zoom
        window.addEventListener('keydown', (e) => {
            if (e.metaKey || e.ctrlKey || e.altKey) return;
            const g = cardGeometry();
            if (e.key === 'ArrowRight') {
                goToNext();
            } else if (e.key === 'ArrowLeft') {
                goToPrev();
            } else if (e.key === '+' || e.key === '=') {
                zoomBy(1.4, g.cx, g.cy);
            } else if (e.key === '-' || e.key === '_') {
                zoomBy(1 / 1.4, g.cx, g.cy);
            } else if (e.key === '0') {
                resetZoom(true);
            } else if (e.key === 'Escape') {
                if (zoomActive) {
                    resetZoom(true);
                } else {
                    window.location.href = '/';
                }
            }
        });

        // Browser back/forward navigation
        window.addEventListener('popstate', (e) => {
            if (e.state && typeof e.state.index === 'number') {
                renderWork(e.state.index, false);
            } else {
                renderWork(getInitialIndex(), false);
            }
        });

        // Initialize view
        currentIndex = getInitialIndex();
        renderWork(currentIndex, false);
    </script>

</body>
