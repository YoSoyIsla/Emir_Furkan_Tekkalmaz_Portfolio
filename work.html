<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="pageTitle">Artwork</title>
    <meta name="description" id="metaDescription" content="Artwork by Emir Furkan Tekkalmaz.">
    <meta property="og:title" id="ogTitle" content="Artwork">
    <meta property="og:description" id="ogDescription" content="Artwork by Emir Furkan Tekkalmaz.">
    <link rel="icon" type="image/png" href="./assets/Emir_Logo.png">
    <link rel="apple-touch-icon" href="./assets/Emir_Logo.png">
    <script>
        (function () {
            try {
                var theme = localStorage.getItem('theme');
                if (theme === 'dark') {
                    document.documentElement.setAttribute('data-theme', 'dark');
                }
            } catch (e) { }
        })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400..800;1,400..800&display=swap">
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400..800&text=%E2%86%90%E2%86%92%E2%86%91%E2%86%93%E2%86%97&display=swap">
    <link rel="stylesheet" href="style.css">
</head>

<body class="single-work-body">

    <!-- Sticky Navigation Scaffolding -->
    <header class="pinned_top">
        <div class="container_width">
            <div grid-row="" grid-pad="1" grid-gutter="2">
                <div grid-col="6" grid-pad="1" class="logo-col">
                    <h1><a href="/" class="nav-link">Emir Furkan Tekkalmaz</a></h1>
                </div>
                <div grid-col="6" grid-pad="1" class="desktop-only nav-cluster-col">
                    <nav class="nav-cluster">
                        <a href="/#artworks" class="nav-link artworks-nav-link">Artworks</a>
                        <a href="/about" class="nav-link">About</a>
                        <a href="/contact" class="nav-link">Contact</a>
                        <button class="theme-toggle-btn nav-link" onclick="toggleTheme()" aria-label="Toggle Theme">
                            <svg class="theme-icon sun-icon" width="18" height="18" viewBox="0 0 24 24" fill="none"
                                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <circle cx="12" cy="12" r="5"></circle>
                                <line x1="12" y1="1" x2="12" y2="3"></line>
                                <line x1="12" y1="21" x2="12" y2="23"></line>
                                <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                                <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                                <line x1="1" y1="12" x2="3" y2="12"></line>
                                <line x1="21" y1="12" x2="23" y2="12"></line>
                                <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                                <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
                            </svg>
                            <svg class="theme-icon moon-icon" width="18" height="18" viewBox="0 0 24 24" fill="none"
                                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                            </svg>
                        </button>
                    </nav>
                </div>
                <div grid-col="6" grid-pad="1" class="mobile-only hamburger-col">
                    <button class="hamburger-btn" id="hamburgerBtn" onclick="toggleMobileMenu()" aria-label="Menu">
                        <span></span>
                        <span></span>
                    </button>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Workspace -->
    <main class="container_width single-work-main">

        <!-- Navigation Arrows (Desktop fixed flanking) -->
        <button class="desktop-only work-nav-arrow prev-arrow" id="prevWorkBtn" aria-label="Previous artwork"
            title="Previous artwork (Left Arrow)">
            ←
        </button>

        <button class="desktop-only work-nav-arrow next-arrow" id="nextWorkBtn" aria-label="Next artwork"
            title="Next artwork (Right Arrow)">
            →
        </button>

        <div class="single-work-wrapper">
            <!-- Center Prominent Artwork Frame (Left-aligned text matched to card width) -->
            <div class="single-work-frame" id="singleWorkFrame">
                <div class="single-work-card" id="singleWorkCard">
                    <img id="singleWorkImg" src="" alt="" loading="eager">
                </div>

                <!-- Two-line metadata aligned directly to the left side of the painting -->
                <div class="single-work-meta-container" id="singleWorkMetaContainer">
                    <h1 class="single-work-title" id="singleWorkTitle"></h1>
                    <div class="single-work-subline" id="singleWorkSubline"></div>
                </div>
            </div>
        </div>
    </main>

    <!-- Mobile Navigation Bar fixed at bottom of screen -->
    <nav class="mobile-only mobile-nav-bar" id="mobileNavBar" aria-label="Artwork navigation">
        <button class="work-nav-arrow prev-arrow" id="mobilePrevBtn" aria-label="Previous artwork">
            <span class="nav-arrow-symbol">←</span>
            <span class="nav-arrow-label">Previous</span>
        </button>
        <button class="work-nav-arrow next-arrow" id="mobileNextBtn" aria-label="Next artwork">
            <span class="nav-arrow-label">Next</span>
            <span class="nav-arrow-symbol">→</span>
        </button>
    </nav>

    <!-- Mobile Drawer Overlay -->
    <div class="drawer-backdrop" id="drawerBackdrop" onclick="toggleMobileMenu()"></div>
    <div class="mobile-drawer" id="mobileDrawer">
        <div class="container_width">
            <nav class="drawer-nav">
                <a href="/#artworks" class="drawer-link">Artworks</a>
                <a href="/about" class="drawer-link">About</a>
                <a href="/contact" class="drawer-link">Contact</a>
                <button class="theme-toggle-btn drawer-link" onclick="toggleTheme()" aria-label="Toggle Theme">
                    <svg class="theme-icon sun-icon" width="18" height="18" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="5"></circle>
                        <line x1="12" y1="1" x2="12" y2="3"></line>
                        <line x1="12" y1="21" x2="12" y2="23"></line>
                        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                        <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                        <line x1="1" y1="12" x2="3" y2="12"></line>
                        <line x1="21" y1="12" x2="23" y2="12"></line>
                        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                        <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
                    </svg>
                    <svg class="theme-icon moon-icon" width="18" height="18" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                    </svg>
                </button>
            </nav>
        </div>
    </div>

    <script type="module">
        import { WORKS } from './works-data.js';

        // Theme management
        function initTheme() {
            const savedTheme = localStorage.getItem('theme') || 'light';
            if (savedTheme === 'dark') {
                document.documentElement.setAttribute('data-theme', 'dark');
            } else {
                document.documentElement.removeAttribute('data-theme');
            }
        }

        window.toggleTheme = function () {
            const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
            if (isDark) {
                document.documentElement.removeAttribute('data-theme');
                localStorage.setItem('theme', 'light');
            } else {
                document.documentElement.setAttribute('data-theme', 'dark');
                localStorage.setItem('theme', 'dark');
            }
            if (document.activeElement && document.activeElement.blur) {
                document.activeElement.blur();
            }
        };

        initTheme();

        window.toggleMobileMenu = function () {
            const drawer = document.getElementById('mobileDrawer');
            const backdrop = document.getElementById('drawerBackdrop');
            const btn = document.getElementById('hamburgerBtn');
            if (drawer && backdrop && btn) {
                const isOpen = drawer.classList.toggle('open');
                backdrop.classList.toggle('show', isOpen);
                btn.classList.toggle('open', isOpen);
                document.body.style.overflow = isOpen ? 'hidden' : '';
            }
        };

        // Artwork View Logic
        let currentIndex = 0;

        function getInitialIndex() {
            const params = new URLSearchParams(window.location.search);
            const idParam = params.get('id');
            if (idParam) {
                const foundIndex = WORKS.findIndex(w => w.id.toLowerCase() === idParam.toLowerCase());
                if (foundIndex !== -1) return foundIndex;
                const parsedNum = parseInt(idParam, 10);
                if (!isNaN(parsedNum) && parsedNum >= 0 && parsedNum < WORKS.length) {
                    return parsedNum;
                }
            }
            return 0;
        }

        const frame = document.getElementById('singleWorkFrame');
        const img = document.getElementById('singleWorkImg');
        const card = document.getElementById('singleWorkCard');
        const titleEl = document.getElementById('singleWorkTitle');
        const sublineEl = document.getElementById('singleWorkSubline');
        const metaContainer = document.getElementById('singleWorkMetaContainer');
        const pageTitle = document.getElementById('pageTitle');

        function updateMobileLayout() {
            const isMobile = window.innerWidth <= 768;
            if (!isMobile) {
                card.style.width = '';
                card.style.height = '';
                if (metaContainer && card) {
                    const rect = card.getBoundingClientRect();
                    if (rect.width > 0) {
                        metaContainer.style.maxWidth = `${rect.width}px`;
                        metaContainer.style.width = `${rect.width}px`;
                    }
                }
                return;
            }

            const vh = window.innerHeight || document.documentElement.clientHeight;
            const vw = window.innerWidth || document.documentElement.clientWidth;
            const work = WORKS[currentIndex];
            const ar = (work && work.aspectRatio) ? work.aspectRatio : 1.2;

            const navTopH = 44;
            const navBottomH = 44;
            const topPadding = Math.min(64, Math.max(36, Math.round(vh * 0.065)));
            const bottomPadding = 32;
            const horizontalBuffer = 40; // 20px left + 20px right margin

            const availH = vh - navTopH - navBottomH - topPadding - bottomPadding;
            const availW = vw - horizontalBuffer;

            // Protected footprint for metadata text and grid row gap
            const metaH = metaContainer && metaContainer.offsetHeight > 0 ? metaContainer.offsetHeight : 52;
            const metaGap = 10;

            const maxCardH = Math.max(100, availH - metaH - metaGap);
            const maxCardW = Math.max(100, availW);

            let w, h;
            if (maxCardH * ar <= maxCardW) {
                h = Math.floor(maxCardH);
                w = Math.floor(maxCardH * ar);
            } else {
                w = Math.floor(maxCardW);
                h = Math.floor(maxCardW / ar);
            }

            card.style.width = `${w}px`;
            card.style.height = `${h}px`;
            metaContainer.style.width = `${w}px`;
            metaContainer.style.maxWidth = `${w}px`;
        }

        function syncMetaWidth() {
            updateMobileLayout();
        }

        window.addEventListener('resize', syncMetaWidth);
        window.addEventListener('orientationchange', () => {
            setTimeout(syncMetaWidth, 50);
        });

        let isSwitching = false;

        function renderWork(index, updateHistory = true) {
            if (typeof resetZoom === 'function') resetZoom(false);
            if (index < 0) index = WORKS.length - 1;
            if (index >= WORKS.length) index = 0;
            currentIndex = index;

            const work = WORKS[currentIndex];

            if (updateHistory) {
                const newUrl = `/work?id=${work.id}`;
                window.history.pushState({ index: currentIndex }, '', newUrl);
            }

            document.title = work.title;
            if (pageTitle) pageTitle.textContent = work.title;
            const ogTitle = document.getElementById('ogTitle');
            if (ogTitle) ogTitle.setAttribute('content', work.title);

            // Preload new artwork image
            const newImg = new Image();
            newImg.src = work.image;

            const applyContent = () => {
                img.src = work.image;
                img.alt = `${work.title}, ${work.year}`;
                img.classList.add('is-loaded');

                // Update typography/metadata
                titleEl.textContent = work.title;
                const sublineParts = [];
                if (work.dimensions) sublineParts.push(work.dimensions);
                if (work.medium) sublineParts.push(work.medium);
                if (work.year) sublineParts.push(work.year);
                sublineEl.textContent = sublineParts.join(', ');

                card.style.setProperty('--ar', work.aspectRatio || 1.2);
                syncMetaWidth();

                // Smoothly fade in new image & text together
                requestAnimationFrame(() => {
                    frame.classList.add('is-visible');
                    isSwitching = false;
                });
            };

            if (frame.classList.contains('is-visible')) {
                // Switching between artworks: smooth synchronized exit then entry
                isSwitching = true;
                frame.classList.remove('is-visible');
                card.classList.remove('is-progressive');

                const onExitDone = () => {
                    if (newImg.complete) {
                        applyContent();
                    } else {
                        newImg.onload = applyContent;
                    }
                };

                setTimeout(onExitDone, 280);
            } else {
                // Initial entrance
                if (newImg.complete) {
                    applyContent();
                } else {
                    newImg.onload = applyContent;
                }
            }
        }

        // Setup Zoom Tracking for the Single Work Card
        let progressiveTimer = null;
        let animationFrameId = null;

        function updateOrigin(e) {
            const rect = card.getBoundingClientRect();
            const x = Math.max(0, Math.min(100, ((e.clientX - rect.left) / rect.width) * 100));
            const y = Math.max(0, Math.min(100, ((e.clientY - rect.top) / rect.height) * 100));

            if (animationFrameId) cancelAnimationFrame(animationFrameId);
            animationFrameId = requestAnimationFrame(() => {
                img.style.transformOrigin = `${x}% ${y}%`;
            });
        }

        card.addEventListener('mouseenter', (e) => {
            updateOrigin(e);
            progressiveTimer = setTimeout(() => {
                card.classList.add('is-progressive');
            }, 120);
        });

        card.addEventListener('mousemove', (e) => {
            updateOrigin(e);
        });

        card.addEventListener('mouseleave', () => {
            if (progressiveTimer) {
                clearTimeout(progressiveTimer);
                progressiveTimer = null;
            }
            card.classList.remove('is-progressive');
            if (animationFrameId) cancelAnimationFrame(animationFrameId);
        });

        // Navigation triggers
        function goToNext() {
            renderWork(currentIndex + 1);
        }

        function goToPrev() {
            renderWork(currentIndex - 1);
        }

        const prevWorkBtn = document.getElementById('prevWorkBtn');
        const nextWorkBtn = document.getElementById('nextWorkBtn');
        const mobilePrevBtn = document.getElementById('mobilePrevBtn');
        const mobileNextBtn = document.getElementById('mobileNextBtn');

        if (prevWorkBtn) {
            prevWorkBtn.addEventListener('click', () => {
                goToPrev();
                if (document.activeElement && document.activeElement.blur) {
                    document.activeElement.blur();
                }
            });
        }

        if (nextWorkBtn) {
            nextWorkBtn.addEventListener('click', () => {
                goToNext();
                if (document.activeElement && document.activeElement.blur) {
                    document.activeElement.blur();
                }
            });
        }

        if (mobilePrevBtn) {
            mobilePrevBtn.addEventListener('click', () => {
                goToPrev();
                if (document.activeElement && document.activeElement.blur) {
                    document.activeElement.blur();
                }
            });
        }

        if (mobileNextBtn) {
            mobileNextBtn.addEventListener('click', () => {
                goToNext();
                if (document.activeElement && document.activeElement.blur) {
                    document.activeElement.blur();
                }
            });
        }

        // Keyboard navigation
        window.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight') {
                goToNext();
            } else if (e.key === 'ArrowLeft') {
                goToPrev();
            } else if (e.key === 'Escape') {
                window.location.href = '/';
            }
        });

        // Browser back/forward navigation
        window.addEventListener('popstate', (e) => {
            if (e.state && typeof e.state.index === 'number') {
                renderWork(e.state.index, false);
            } else {
                renderWork(getInitialIndex(), false);
            }
        });

        // --- Mobile Pinch-to-Zoom & Pan Gesture Controller ---
        let currentScale = 1;
        let currentPanX = 0;
        let currentPanY = 0;

        let initialPinchDistance = 0;
        let initialScale = 1;
        let initialPanX = 0;
        let initialPanY = 0;
        let initialMidX = 0;
        let initialMidY = 0;

        let touchStartX = 0;
        let touchStartY = 0;
        let touchStartPanX = 0;
        let touchStartPanY = 0;
        let isPinching = false;
        let isPanning = false;
        let lastTapTime = 0;

        function getMaxPan() {
            if (!card) return { maxPanX: 0, maxPanY: 0 };
            const rect = card.getBoundingClientRect();
            const maxPanX = Math.max(0, (rect.width * (currentScale - 1)) / 2);
            const maxPanY = Math.max(0, (rect.height * (currentScale - 1)) / 2);
            return { maxPanX, maxPanY };
        }

        function applyTransform(animated = false) {
            if (currentScale === 1 && currentPanX === 0 && currentPanY === 0) {
                img.style.transform = '';
                img.style.transition = '';
                return;
            }
            if (animated) {
                img.style.transition = 'transform 0.28s cubic-bezier(0.16, 1, 0.3, 1)';
            } else {
                img.style.transition = 'none';
            }
            img.style.transform = `translate3d(${currentPanX}px, ${currentPanY}px, 0) scale(${currentScale})`;
            img.style.transformOrigin = '50% 50%';
        }

        function resetZoom(animated = true) {
            currentScale = 1;
            currentPanX = 0;
            currentPanY = 0;
            isPinching = false;
            isPanning = false;
            if (animated) {
                img.style.transition = 'transform 0.28s cubic-bezier(0.16, 1, 0.3, 1)';
                img.style.transform = '';
                setTimeout(() => {
                    img.style.transition = '';
                }, 300);
            } else {
                img.style.transition = '';
                img.style.transform = '';
            }
        }

        function getTouchDistance(t1, t2) {
            return Math.hypot(t2.clientX - t1.clientX, t2.clientY - t1.clientY);
        }

        function getTouchMidpoint(t1, t2) {
            return {
                x: (t1.clientX + t2.clientX) / 2,
                y: (t1.clientY + t2.clientY) / 2
            };
        }

        // Prevent iOS Safari proprietary viewport zoom/gesture hijacking
        document.addEventListener('gesturestart', (e) => e.preventDefault(), { passive: false });
        document.addEventListener('gesturechange', (e) => e.preventDefault(), { passive: false });
        document.addEventListener('gestureend', (e) => e.preventDefault(), { passive: false });

        // Bind touch gesture recognizer to the entire stage wrapper for seamless multi-touch tracking
        const stage = document.querySelector('.single-work-wrapper') || card;
        let wasPinching = false;

        function startPinch(t1, t2) {
            isPinching = true;
            isPanning = false;
            wasPinching = true;
            initialPinchDistance = getTouchDistance(t1, t2);
            initialScale = currentScale;
            initialPanX = currentPanX;
            initialPanY = currentPanY;
            const mid = getTouchMidpoint(t1, t2);
            initialMidX = mid.x;
            initialMidY = mid.y;
            img.style.transition = 'none';
        }

        function startPan(touch) {
            isPanning = true;
            isPinching = false;
            touchStartX = touch.clientX;
            touchStartY = touch.clientY;
            touchStartPanX = currentPanX;
            touchStartPanY = currentPanY;
            img.style.transition = 'none';
        }

        stage.addEventListener('touchstart', (e) => {
            if (e.touches.length === 2) {
                // Two-finger pinch start: immediately prevent browser viewport zoom
                e.preventDefault();
                startPinch(e.touches[0], e.touches[1]);
            } else if (e.touches.length === 1) {
                wasPinching = false;
                touchStartX = e.touches[0].clientX;
                touchStartY = e.touches[0].clientY;
                touchStartPanX = currentPanX;
                touchStartPanY = currentPanY;

                if (currentScale > 1.05) {
                    isPanning = true;
                    img.style.transition = 'none';
                } else {
                    isPanning = false;
                }

                // Double-tap on card to zoom in/out
                const now = Date.now();
                if (now - lastTapTime < 300) {
                    if (currentScale > 1.05) {
                        resetZoom(true);
                    } else {
                        currentScale = 2.5;
                        const rect = card.getBoundingClientRect();
                        const tapX = touchStartX - rect.left - rect.width / 2;
                        const tapY = touchStartY - rect.top - rect.height / 2;
                        const { maxPanX, maxPanY } = getMaxPan();
                        currentPanX = Math.max(-maxPanX, Math.min(maxPanX, -tapX * 1.5));
                        currentPanY = Math.max(-maxPanY, Math.min(maxPanY, -tapY * 1.5));
                        applyTransform(true);
                    }
                    lastTapTime = 0;
                    return;
                }
                lastTapTime = now;
            }
        }, { passive: false });

        stage.addEventListener('touchmove', (e) => {
            if (e.touches.length === 2) {
                e.preventDefault(); // Lock container; prevent native page zoom
                if (!isPinching) {
                    startPinch(e.touches[0], e.touches[1]);
                    return;
                }

                const newDist = getTouchDistance(e.touches[0], e.touches[1]);
                if (initialPinchDistance > 10) {
                    const factor = newDist / initialPinchDistance;
                    let newScale = initialScale * factor;
                    // Elastic pinch range: 0.85x to 5x
                    newScale = Math.max(0.85, Math.min(5.0, newScale));
                    currentScale = newScale;

                    const newMid = getTouchMidpoint(e.touches[0], e.touches[1]);
                    const deltaX = newMid.x - initialMidX;
                    const deltaY = newMid.y - initialMidY;
                    currentPanX = initialPanX + deltaX;
                    currentPanY = initialPanY + deltaY;

                    applyTransform(false);
                }
            } else if (e.touches.length === 1 && isPanning && currentScale > 1.05) {
                e.preventDefault(); // Confine panning within container
                const dx = e.touches[0].clientX - touchStartX;
                const dy = e.touches[0].clientY - touchStartY;
                currentPanX = touchStartPanX + dx;
                currentPanY = touchStartPanY + dy;

                // Soft boundary resistance
                const { maxPanX, maxPanY } = getMaxPan();
                if (Math.abs(currentPanX) > maxPanX) {
                    const over = Math.abs(currentPanX) - maxPanX;
                    currentPanX = Math.sign(currentPanX) * (maxPanX + over * 0.3);
                }
                if (Math.abs(currentPanY) > maxPanY) {
                    const over = Math.abs(currentPanY) - maxPanY;
                    currentPanY = Math.sign(currentPanY) * (maxPanY + over * 0.3);
                }

                applyTransform(false);
            }
        }, { passive: false });

        stage.addEventListener('touchend', (e) => {
            if (isPinching) {
                if (e.touches.length === 1) {
                    // Seamless transition: one finger remaining after pinch converts to pan without jump
                    isPinching = false;
                    startPan(e.touches[0]);
                } else if (e.touches.length === 0) {
                    isPinching = false;
                    if (currentScale < 1.08) {
                        resetZoom(true);
                    } else {
                        currentScale = Math.min(4.0, Math.max(1.0, currentScale));
                        const { maxPanX, maxPanY } = getMaxPan();
                        currentPanX = Math.max(-maxPanX, Math.min(maxPanX, currentPanX));
                        currentPanY = Math.max(-maxPanY, Math.min(maxPanY, currentPanY));
                        applyTransform(true);
                    }
                }
            } else if (isPanning) {
                if (e.touches.length === 0) {
                    isPanning = false;
                    if (currentScale < 1.08) {
                        resetZoom(true);
                    } else {
                        const { maxPanX, maxPanY } = getMaxPan();
                        currentPanX = Math.max(-maxPanX, Math.min(maxPanX, currentPanX));
                        currentPanY = Math.max(-maxPanY, Math.min(maxPanY, currentPanY));
                        applyTransform(true);
                    }
                }
            } else if (!wasPinching && currentScale <= 1.05 && e.changedTouches && e.changedTouches.length === 1) {
                // Single-finger swipe navigation between artworks (only if not preceded by pinch)
                const diffX = e.changedTouches[0].clientX - touchStartX;
                const diffY = e.changedTouches[0].clientY - touchStartY;
                if (Math.abs(diffX) > 45 && Math.abs(diffX) > Math.abs(diffY) * 1.3) {
                    if (diffX < 0) {
                        goToNext();
                    } else {
                        goToPrev();
                    }
                }
            }
        });

        stage.addEventListener('touchcancel', () => {
            isPinching = false;
            isPanning = false;
            wasPinching = false;
            if (currentScale < 1.08) {
                resetZoom(true);
            } else {
                const { maxPanX, maxPanY } = getMaxPan();
                currentPanX = Math.max(-maxPanX, Math.min(maxPanX, currentPanX));
                currentPanY = Math.max(-maxPanY, Math.min(maxPanY, currentPanY));
                applyTransform(true);
            }
        });

        // Initialize view
        currentIndex = getInitialIndex();
        renderWork(currentIndex, false);
    </script>

</body>
