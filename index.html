    <script>
        (function () {
            try {
                var theme = localStorage.getItem('theme');
                var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
                var dark = theme === 'dark' || (!theme && prefersDark);
                if (dark) {
                    document.documentElement.setAttribute('data-theme', 'dark');
                } else {
                    document.documentElement.removeAttribute('data-theme');
                }
                var meta = document.querySelector('meta[name="theme-color"]');
                if (meta) meta.setAttribute('content', dark ? '#000000' : '#FAF9F6');
            } catch (e) { }
        })();
    </script>

    <!-- Main Workspace -->
    <main class="container_width home-main">
        <!-- Main Home Screen Hero -->
        <section class="home-hero" aria-label="Featured Artwork">
            <div class="gallery-card home-hero-card in-view">
                <video class="home-hero-video home-hero-img is-loaded" id="homeHeroVideo" autoplay muted playsinline preload="auto" aria-label="Featured Artwork Video"></video>
                <script>
                    (function() {
                        var v = document.getElementById('homeHeroVideo');
                        if (v) {
                            var isMobile = window.matchMedia('(max-width: 768px)').matches;
                            var src = isMobile ? '/assets/Hero_Video_Mobile_1080p.mp4' : '/assets/Hero_Video_Desktop_1200p.mp4';
                            v.src = src;
                            v.load();
                            var p = v.play();
                            if (p !== undefined) {
                                p.catch(function() {
                                    v.muted = true;
                                    v.play().catch(function() {});
                                });
                            }
                        }
                    })();
                </script>
            </div>
        </section>

        <!-- Justified Project Gallery
             Rows are generated at dev/build time from GALLERY_ROWS in works-data.js
             (large paintings: max 2 per row, smaller paintings: max 3 per row). -->
        <section class="image-gallery" id="artworks" aria-labelledby="artworksHeading">
            <h2 id="artworksHeading" class="visually-hidden">Artworks</h2>
<!--ARTWORK_GALLERY-->

    <!-- Mobile Drawer Overlay -->
    <div class="drawer-backdrop" id="drawerBackdrop" onclick="toggleMobileMenu()"></div>
    <div class="mobile-drawer" id="mobileDrawer">
        <div class="container_width">
            <nav class="drawer-nav">
                <a href="#artworks" class="drawer-link" onclick="handleMobileArtworksClick(event)">Artworks</a>
                <a href="/about" class="drawer-link">About</a>
                <a href="/contact" class="drawer-link">Contact</a>
                <button class="theme-toggle-btn drawer-link" onclick="toggleTheme()" aria-label="Toggle Theme">
                    <svg class="theme-icon sun-icon" width="18" height="18" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="5"></circle>
                        <line x1="12" y1="1" x2="12" y2="3"></line>
                        <line x1="12" y1="21" x2="12" y2="23"></line>
                        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                        <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                        <line x1="1" y1="12" x2="3" y2="12"></line>
                        <line x1="21" y1="12" x2="23" y2="12"></line>
                        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                        <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
                    </svg>
                    <svg class="theme-icon moon-icon" width="18" height="18" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">

                    </svg>
                </button>
            </nav>
        </div>

    <script>
        // Theme switching lives in /theme.js (shared by every page).

        function toggleMobileMenu() {
            const drawer = document.getElementById('mobileDrawer');
            const backdrop = document.getElementById('drawerBackdrop');
            const btn = document.getElementById('hamburgerBtn');
            if (drawer && backdrop && btn) {
                const isOpen = drawer.classList.toggle('open');
                backdrop.classList.toggle('show', isOpen);
                btn.classList.toggle('open', isOpen);
                document.body.style.overflow = isOpen ? 'hidden' : '';
            }
        }

        function getArtworksScrollY() {
            const artworks = document.getElementById('artworks');
            if (!artworks) return 0;
            const navHeader = document.querySelector('.pinned_top');
            const navHeight = navHeader ? navHeader.offsetHeight : 44;
            const gridGap = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--grid-gap')) || 20;
            
            // Calculate absolute layout top in document coordinates (unaffected by transforms, zoom, or current scroll)
            let top = 0;
            let el = artworks;
            while (el) {
                top += el.offsetTop;
                el = el.offsetParent;
            }
            return Math.max(0, top - navHeight - gridGap);
        }

        function scrollToArtworks(e, isInstant = false) {
            if (e) {
                e.preventDefault();
                e.stopPropagation();
            }
            const targetScrollY = getArtworksScrollY();
            window.scrollTo({
                top: targetScrollY,
                behavior: isInstant ? 'instant' : 'smooth'
            });
        }

        function handleMobileArtworksClick(e) {
            if (e) {
                e.preventDefault();
                e.stopPropagation();
            }
            toggleMobileMenu();
            setTimeout(() => {
                scrollToArtworks(null, false);
            }, 250);
        }

        // When navigating from a separate route (e.g. /#artworks), mount directly at the anchor without scrolling down
        if (window.location.hash === '#artworks') {
            if ('scrollRestoration' in history) {
                history.scrollRestoration = 'manual';
            }
            const jumpToArtworksInstant = () => {
                scrollToArtworks(null, true);
            };
            jumpToArtworksInstant();
            window.addEventListener('DOMContentLoaded', jumpToArtworksInstant);
            window.addEventListener('load', jumpToArtworksInstant);
        }

        // Dynamic Hero Video Loading (Zero Extra Bandwidth) + Loop with Black Transition
        document.addEventListener('DOMContentLoaded', () => {
            const heroVideo = document.getElementById('homeHeroVideo');
            if (heroVideo) {
                heroVideo.muted = true;
                heroVideo.defaultMuted = true;
                heroVideo.playsInline = true;

                // Match media for mobile breakpoint (max-width: 768px)
                const mobileQuery = window.matchMedia('(max-width: 768px)');
                let currentMode = null;

                const setVideoSource = () => {
                    const isMobile = mobileQuery.matches;
                    const targetMode = isMobile ? 'mobile' : 'desktop';
                    if (currentMode === targetMode) return;
                    currentMode = targetMode;

                    const targetSrc = isMobile
                        ? '/assets/Hero_Video_Mobile_1080p.mp4'
                        : '/assets/Hero_Video_Desktop_1200p.mp4';

                    if (!heroVideo.src || !heroVideo.src.endsWith(targetSrc)) {
                        heroVideo.src = targetSrc;
                        heroVideo.load();
                    }
                    const p = heroVideo.play();
                    if (p !== undefined) {
                        p.catch(() => {
                            heroVideo.muted = true;
                            heroVideo.play().catch(() => {});
                        });
                    }
                };

                // Load initial single video
                setVideoSource();

                // Switch if viewport crosses breakpoint (e.g. tablet rotation or browser resizing)
                mobileQuery.addEventListener('change', setVideoSource);

                let isTransitioning = false;

                const replayWithBlack = () => {
                    if (isTransitioning) return;
                    isTransitioning = true;

                    // Smooth fade to black
                    heroVideo.classList.add('is-black');

                    setTimeout(() => {
                        heroVideo.currentTime = 0;
                        const playPromise = heroVideo.play();
                        const handlePlaying = () => {
                            heroVideo.removeEventListener('playing', handlePlaying);
                            // Hold pure black briefly, then fade back in
                            setTimeout(() => {
                                heroVideo.classList.remove('is-black');
                                isTransitioning = false;
                            }, 250);
                        };

                        heroVideo.addEventListener('playing', handlePlaying);

                        if (playPromise !== undefined) {
                            playPromise.catch(() => {
                                heroVideo.classList.remove('is-black');
                                isTransitioning = false;
                            });
                        }
                    }, 600); // 600ms fade to black
                };

                heroVideo.addEventListener('ended', replayWithBlack);

                // Near end trigger (prevents freeze on final frame on certain browsers)
                heroVideo.addEventListener('timeupdate', () => {
                    if (heroVideo.duration && (heroVideo.duration - heroVideo.currentTime < 0.25)) {
                        replayWithBlack();
                    }
                });
            }

            const cards = document.querySelectorAll('.gallery-card');

            // Scroll Entrance Observer
            const observerOptions = {
                root: null,
                rootMargin: '50px 0px 50px 0px',
                threshold: 0.01
            };

            const observer = new IntersectionObserver((entries, obs) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        const card = entry.target;
                        const img = card.querySelector('img');
                        if (img) {
                            if (img.complete) {
                                img.classList.add('is-loaded');
                            } else {
                                img.addEventListener('load', () => {
                                    img.classList.add('is-loaded');
                                });
                            }
                        }
                        card.classList.add('in-view');
                        obs.unobserve(card);
                    }
                });
            }, observerOptions);

            // Hover zoom is a mouse-only effect: touch taps never trigger it (no stuck zoom on mobile).
            const finePointer = window.matchMedia('(hover: hover) and (pointer: fine)');

            let activeTouchTimeout = null;

            cards.forEach(card => {
                observer.observe(card);

                // Mobile touch interaction: reveal dark tint & caption overlay on tap/touch
                card.addEventListener('touchstart', () => {
                    cards.forEach(c => {
                        if (c !== card) c.classList.remove('is-touched');
                    });
                    card.classList.add('is-touched');
                }, { passive: true });

                card.addEventListener('touchmove', () => {
                    // Remove overlay when user scrolls page
                    card.classList.remove('is-touched');
                }, { passive: true });

                card.addEventListener('touchend', () => {
                    if (activeTouchTimeout) clearTimeout(activeTouchTimeout);
                    activeTouchTimeout = setTimeout(() => {
                        card.classList.remove('is-touched');
                    }, 350);
                }, { passive: true });

                card.addEventListener('touchcancel', () => {
                    card.classList.remove('is-touched');
                }, { passive: true });

                const img = card.querySelector('img');
                if (img) {
                    let progressiveTimer = null;
                    let animationFrameId = null;

                    const isMouseHover = (e) => e.pointerType === 'mouse' && finePointer.matches;

                    function updateOrigin(e) {
                        const rect = card.getBoundingClientRect();
                        const x = Math.max(0, Math.min(100, ((e.clientX - rect.left) / rect.width) * 100));
                        const y = Math.max(0, Math.min(100, ((e.clientY - rect.top) / rect.height) * 100));

                        if (animationFrameId) cancelAnimationFrame(animationFrameId);
                        animationFrameId = requestAnimationFrame(() => {
                            img.style.transformOrigin = `${x}% ${y}%`;
                        });
                    }

                    function endHover() {
                        if (progressiveTimer) {
                            clearTimeout(progressiveTimer);
                            progressiveTimer = null;
                        }
                        card.classList.remove('is-progressive');
                        if (animationFrameId) cancelAnimationFrame(animationFrameId);
                    }

                    card.addEventListener('pointerenter', (e) => {
                        if (!isMouseHover(e)) return;
                        updateOrigin(e);
                        progressiveTimer = setTimeout(() => {
                            card.classList.add('is-progressive');
                        }, 120);
                    });

                    card.addEventListener('pointermove', (e) => {
                        if (isMouseHover(e)) updateOrigin(e);
                    });

                    card.addEventListener('pointerleave', endHover);
                    card.addEventListener('pointercancel', endHover);
                }
            });
        });
    </script>
