<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="index, follow">
    <title>Contact</title>
    <meta name="description"
        content="Contact Emir Furkan Tekkalmaz, Istanbul-based contemporary painter and visual artist.">
    <meta property="og:title" content="Contact">
    <meta property="og:description"
        content="Contact Emir Furkan Tekkalmaz, Istanbul-based contemporary painter and visual artist.">
    <link rel="icon" type="image/png" href="/assets/Emir_Logo-BVGLV1ir.png">
    <link rel="apple-touch-icon" href="/assets/Emir_Logo-BVGLV1ir.png">
    <link rel="preload" as="image" href="/assets/studio_place_holder-ib_PMema.jpg">
    <script>
        (function () {
            try {
                var theme = localStorage.getItem('theme');
                if (theme === 'dark') {
                    document.documentElement.setAttribute('data-theme', 'dark');
                }
            } catch (e) { }
        })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400..800;1,400..800&display=swap">
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400..800&text=%E2%86%90%E2%86%92%E2%86%91%E2%86%93%E2%86%97&display=swap">
  <link rel="stylesheet" crossorigin href="/assets/style-B0IlMx8R.css">
</head>

<body>

    <!-- Sticky Navigation Scaffolding -->
    <header class="pinned_top">
        <div class="container_width">
            <div grid-row="" grid-pad="1" grid-gutter="2">
                <div grid-col="6" grid-pad="1" class="logo-col">
                    <h1><a href="/" class="nav-logo">Emir Furkan Tekkalmaz</a></h1>
                </div>
                <div grid-col="6" grid-pad="1" class="desktop-only nav-cluster-col">
                    <nav class="nav-cluster">
                        <a href="/#artworks" class="nav-link artworks-nav-link">Artworks</a>
                        <a href="/about" class="nav-link">About</a>
                        <a href="/contact" class="nav-link active">Contact</a>
                        <button class="theme-toggle-btn nav-link" onclick="toggleTheme()" aria-label="Toggle Theme">
                            <svg class="theme-icon sun-icon" width="18" height="18" viewBox="0 0 24 24" fill="none"
                                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <circle cx="12" cy="12" r="5"></circle>
                                <line x1="12" y1="1" x2="12" y2="3"></line>
                                <line x1="12" y1="21" x2="12" y2="23"></line>
                                <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                                <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                                <line x1="1" y1="12" x2="3" y2="12"></line>
                                <line x1="21" y1="12" x2="23" y2="12"></line>
                                <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                                <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
                            </svg>
                            <svg class="theme-icon moon-icon" width="18" height="18" viewBox="0 0 24 24" fill="none"
                                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                            </svg>
                        </button>
                    </nav>
                </div>
                <div grid-col="6" grid-pad="1" class="mobile-only hamburger-col">
                    <button class="hamburger-btn" id="hamburgerBtn" onclick="toggleMobileMenu()" aria-label="Menu">
                        <span></span>
                        <span></span>
                    </button>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Workspace -->
    <main class="container_width">

        <!-- Contact Page Grid System -->
        <div grid-row="" grid-gutter="2" class="contact-grid" grid-responsive="">

            <!-- Left Content Column: Direct Connect Info & Links (Col 1–5) -->
            <div grid-col="5" class="about-bio contact-bio-col">
                <h2>Get in touch<br>↓</h2>
                <div class="contact-info">
                    <p class="inquiries-text desktop-only">For exhibition inquiries, available works, or just to say
                        hello:</p>
                    <div class="contact-links-list">
                        <a href="mailto:emirfurkantekkalmaz@gmail.com"
                            class="contact-link">emirfurkantekkalmaz@gmail.com <span
                                class="arrow-glyph">&#x2197;&#xFE0E;</span></a>
                        <a href="https://www.instagram.com/emir.tekkalmaz/" target="_blank" rel="noopener noreferrer"
                            class="contact-link">Instagram <span class="arrow-glyph">&#x2197;&#xFE0E;</span></a>
                    </div>
                </div>
            </div>

            <!-- Column 6: Clear Gutter / Tab Space -->
            <div grid-col="1" class="desktop-only"></div>

            <!-- Right Content Column: studio_place_holder Image & Address (Col 7–12) -->
            <div grid-col="6" class="contact-image-col">
                <div class="contact-image-card">
                    <img src="/assets/studio_place_holder-ib_PMema.jpg" alt="Studio" loading="eager"
                        onload="this.classList.add('is-loaded')">
                </div>
                <div class="studio-info-block">
                    <p class="about-section-title">Studio</p>
                    <address class="contact-address">
                        Yıldız Mahallesi, Serencebey Yokuşu,<br>Beşiktaş / İstanbul, Türkiye
                    </address>
                </div>
            </div>

        </div>

    </main>

    <!-- Mobile Drawer Overlay -->
    <div class="drawer-backdrop" id="drawerBackdrop" onclick="toggleMobileMenu()"></div>
    <div class="mobile-drawer" id="mobileDrawer">
        <div class="container_width">
            <nav class="drawer-nav">
                <a href="/#artworks" class="drawer-link">Artworks</a>
                <a href="/about" class="drawer-link">About</a>
                <a href="/contact" class="drawer-link active">Contact</a>
                <button class="theme-toggle-btn drawer-link" onclick="toggleTheme()" aria-label="Toggle Theme">
                    <svg class="theme-icon sun-icon" width="18" height="18" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="5"></circle>
                        <line x1="12" y1="1" x2="12" y2="3"></line>
                        <line x1="12" y1="21" x2="12" y2="23"></line>
                        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                        <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                        <line x1="1" y1="12" x2="3" y2="12"></line>
                        <line x1="21" y1="12" x2="23" y2="12"></line>
                        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                        <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
                    </svg>
                    <svg class="theme-icon moon-icon" width="18" height="18" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                    </svg>
                </button>
            </nav>
        </div>
    </div>

    <script>
        // Dark / Light Mode Switcher Logic
        function initTheme() {
            const savedTheme = localStorage.getItem('theme') || 'light';
            if (savedTheme === 'dark') {
                document.documentElement.setAttribute('data-theme', 'dark');
            } else {
                document.documentElement.removeAttribute('data-theme');
            }
        }

        function toggleTheme() {
            const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
            if (isDark) {
                document.documentElement.removeAttribute('data-theme');
                localStorage.setItem('theme', 'light');
            } else {
                document.documentElement.setAttribute('data-theme', 'dark');
                localStorage.setItem('theme', 'dark');
            }
            if (document.activeElement && document.activeElement.blur) {
                document.activeElement.blur();
            }
        }

        initTheme();

        function toggleMobileMenu() {
            const drawer = document.getElementById('mobileDrawer');
            const backdrop = document.getElementById('drawerBackdrop');
            const btn = document.getElementById('hamburgerBtn');
            if (drawer && backdrop && btn) {
                const isOpen = drawer.classList.toggle('open');
                backdrop.classList.toggle('show', isOpen);
                btn.classList.toggle('open', isOpen);
                document.body.style.overflow = isOpen ? 'hidden' : '';
            }
        }

        // Image Entrance Fade-In
        document.addEventListener('DOMContentLoaded', () => {
            const img = document.querySelector('.contact-image-card img');
            if (img) {
                if (img.complete) {
                    img.classList.add('is-loaded');
                } else {
                    img.addEventListener('load', () => img.classList.add('is-loaded'));
                }
            }
        });
    </script>

</body>

</html>
