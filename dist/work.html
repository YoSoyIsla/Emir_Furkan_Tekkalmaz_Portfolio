<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="index, follow">
    <title id="pageTitle">Artwork Detail — Emir Furkan Tekkalmaz</title>
    <meta name="description" id="metaDescription" content="Artwork detail and specifications by Emir Furkan Tekkalmaz.">
    <link rel="icon" type="image/png" href="./assets/Emir_Logo-BVGLV1ir.png">
    <link rel="apple-touch-icon" href="./assets/Emir_Logo-BVGLV1ir.png">
  <script type="module" crossorigin src="./assets/work-Bn0S8A8n.js"></script>
  <link rel="stylesheet" crossorigin href="./assets/style-DjnaDfXC.css">
</head>

<body>

    <!-- Sticky Navigation Scaffolding -->
    <header class="pinned_top">
        <div class="container_width">
            <div grid-row="" grid-pad="1" grid-gutter="2">
                <div grid-col="6" grid-pad="1" class="logo-col">
                    <h1><a href="index.html" class="nav-link">Emir Furkan Tekkalmaz</a></h1>
                </div>
                <div grid-col="2" grid-pad="1" class="desktop-only about-nav-col">
                    <a href="about.html" class="nav-link">About</a>
                </div>
                <div grid-col="2" grid-pad="1" class="desktop-only contact-nav-col">
                    <a href="contact.html" class="nav-link">Contact</a>
                </div>
                <div grid-col="2" grid-pad="1" class="desktop-only theme-nav-col">
                    <button class="theme-toggle-btn nav-link" onclick="toggleTheme()" aria-label="Toggle Theme">
                        <svg class="theme-icon sun-icon" width="18" height="18" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="5"></circle>
                            <line x1="12" y1="1" x2="12" y2="3"></line>
                            <line x1="12" y1="21" x2="12" y2="23"></line>
                            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                            <line x1="1" y1="12" x2="3" y2="12"></line>
                            <line x1="21" y1="12" x2="23" y2="12"></line>
                            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
                        </svg>
                        <svg class="theme-icon moon-icon" width="18" height="18" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                        </svg>
                    </button>
                </div>
                <div grid-col="6" grid-pad="1" class="mobile-only hamburger-col">
                    <button class="hamburger-btn" id="hamburgerBtn" onclick="toggleMobileMenu()" aria-label="Menu">
                        <span></span>
                        <span></span>
                    </button>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Workspace -->
    <main class="container_width single-work-main">

        <!-- Navigation Controls (Left arrow ← placed to the left of Right arrow →) -->
        <button class="work-nav-arrow prev-arrow" id="prevWorkBtn" aria-label="Previous artwork"
            title="Previous artwork (Left Arrow ←)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round"
                stroke-linejoin="round">
                <line x1="19" y1="12" x2="5" y2="12"></line>
                <polyline points="12 19 5 12 12 5"></polyline>
            </svg>
        </button>

        <button class="work-nav-arrow next-arrow" id="nextWorkBtn" aria-label="Next artwork"
            title="Next artwork (Right Arrow →)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round"
                stroke-linejoin="round">
                <line x1="5" y1="12" x2="19" y2="12"></line>
                <polyline points="12 5 19 12 12 19"></polyline>
            </svg>
        </button>

        <div class="single-work-wrapper">
            <!-- Center Prominent Artwork Frame (Left-aligned text matched to card width) -->
            <div class="single-work-frame" id="singleWorkFrame">
                <div class="single-work-card" id="singleWorkCard">
                    <img id="singleWorkImg" src="" alt="" loading="eager">
                </div>

                <!-- Two-line metadata aligned directly to the left side of the painting -->
                <div class="single-work-meta-container" id="singleWorkMetaContainer">
                    <h1 class="single-work-title" id="singleWorkTitle"></h1>
                    <div class="single-work-subline" id="singleWorkSubline"></div>
                </div>
            </div>

            <!-- Mobile Navigation Controls below image on touch screens (Left arrow ← to the left of Right arrow →) -->
            <div class="mobile-only mobile-nav-bar" id="mobileNavBar">
                <button class="work-nav-arrow prev-arrow" id="mobilePrevBtn" aria-label="Previous artwork (Left Arrow ←)">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.25"
                        stroke-linecap="round" stroke-linejoin="round">
                        <line x1="19" y1="12" x2="5" y2="12"></line>
                        <polyline points="12 19 5 12 12 5"></polyline>
                    </svg>
                </button>
                <button class="work-nav-arrow next-arrow" id="mobileNextBtn" aria-label="Next artwork (Right Arrow →)">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.25"
                        stroke-linecap="round" stroke-linejoin="round">
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                        <polyline points="12 5 19 12 12 19"></polyline>
                    </svg>
                </button>
            </div>
        </div>
    </main>

    <!-- Mobile Drawer Overlay -->
    <div class="drawer-backdrop" id="drawerBackdrop" onclick="toggleMobileMenu()"></div>
    <div class="mobile-drawer" id="mobileDrawer">
        <div class="container_width">
            <nav class="drawer-nav">
                <a href="index.html" class="drawer-link">Artworks</a>
                <a href="about.html" class="drawer-link">About</a>
                <a href="contact.html" class="drawer-link">Contact</a>
                <button class="theme-toggle-btn drawer-link" onclick="toggleTheme()" aria-label="Toggle Theme">
                    <svg class="theme-icon sun-icon" width="18" height="18" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="5"></circle>
                        <line x1="12" y1="1" x2="12" y2="3"></line>
                        <line x1="12" y1="21" x2="12" y2="23"></line>
                        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                        <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                        <line x1="1" y1="12" x2="3" y2="12"></line>
                        <line x1="21" y1="12" x2="23" y2="12"></line>
                        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                        <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
                    </svg>
                    <svg class="theme-icon moon-icon" width="18" height="18" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                    </svg>
                </button>
            </nav>
        </div>
    </div>


</body>

</html>
